services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  grafana-loki:
    image: grafana/loki
    container_name: grafana-loki
    restart: always
    ports:
      - 3100:3100
    volumes:
      - grafana_loki_data:/temp/loki

volumes:
  prometheus_data:
  grafana_data:
  grafana_loki_data:
